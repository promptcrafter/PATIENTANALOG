      width: 50px; height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 20px; cursor: pointer; transition: all 0.2s;
    }
    .base:hover { transform: scale(1.1); }
    .base.A { background: rgba(255,51,102,0.3); border: 2px solid var(--crimson); color: var(--crimson); }
    .base.T { background: rgba(0,85,255,0.3); border: 2px solid var(--sapphire); color: var(--sapphire); }
    .base.G { background: rgba(0,204,102,0.3); border: 2px solid var(--emerald); color: var(--emerald); }
    .base.C { background: rgba(255,170,0,0.3); border: 2px solid var(--amber); color: var(--amber); }
    .base.error { animation: shake 0.3s; border-style: dashed; }

    .repair-btn.T { background: var(--sapphire); color: white; }
    .repair-btn.G { background: var(--emerald); color: white; }
    .repair-btn.C { background: var(--amber); color: white; }
    .hint { color: #666; font-size: 13px; margin-top: 20px; }

<div class="page-wrapper" style="max-width:1000px;margin:0 auto;padding:70px 20px 20px 20px;position:relative;z-index:1;">
  <div class="container">
    <h1>🧬 DNA Repair Puzzle</h1>
    <p class="subtitle">Fix the mutated bases! Remember: A↔T and G↔C</p>
    <div class="score">Score: <span id="score">0</span> | Fixed: <span id="fixed">0</span>/2</div>

    <div class="dna-container" id="dnaContainer"></div>

    <p style="margin: 20px 0; font-size: 14px;">Click a damaged base, then select the correct repair:</p>

    <div class="repair-options">
      <button class="repair-btn A" onclick="repair('A')">A</button>
      <button class="repair-btn T" onclick="repair('T')">T</button>
      <button class="repair-btn G" onclick="repair('G')">G</button>
      <button class="repair-btn C" onclick="repair('C')">C</button>
    </div>

    <div class="hint">Base pairing rules: A↔T and G↔C</div>
    <div class="message" id="message"></div>
  </div>

  <script>
    // ✅ FIXED: Added error boundary
    try {
      const pairs = { A: 'T', T: 'A', G: 'C', C: 'G' };
      const topBases = ['A', 'T', 'G', 'C', 'A'];
      const errors = [1, 3]; // Positions with errors
      let selectedBase = null;
      let score = 0;
      let fixed = 0;

      function init() {
        const container = document.getElementById('dnaContainer');
        
        topBases.forEach((base, i) => {
          const pairDiv = document.createElement('div');
          pairDiv.className = 'base-pair';

          // Top base
          const topBase = document.createElement('div');
          topBase.className = `base ${base}`;
          topBase.textContent = base;

          // Connector
          const conn = document.createElement('div');
          conn.className = 'connector';

          // Bottom base (with potential error)
          const correctBottom = pairs[base];
          const isError = errors.includes(i);
          const bottomVal = isError ? (base === 'A' ? 'G' : base === 'G' ? 'A' : base === 'T' ? 'C' : 'T') : correctBottom;

          const bottomBase = document.createElement('div');
          bottomBase.className = `base ${bottomVal}` + (isError ? ' error' : '');
          bottomBase.textContent = bottomVal;
          bottomBase.dataset.index = i;
          bottomBase.dataset.correct = correctBottom;
          if (isError) bottomBase.onclick = () => selectBase(bottomBase);

          // ✅ FIXED: Proper DOM structure
          pairDiv.appendChild(topBase);
          pairDiv.appendChild(conn);
          pairDiv.appendChild(bottomBase);
          container.appendChild(pairDiv);
        });
      }

      function selectBase(el) {
        document.querySelectorAll('.base.error').forEach(b => b.style.boxShadow = '');
        // ✅ FIXED: Use thematic cyan color instead of white
        el.style.boxShadow = '0 0 20px #00e5ff';
        selectedBase = el;
      }

      function repair(base) {
        if (!selectedBase) { 
          document.getElementById('message').textContent = '❌ Select a damaged base first!'; 
          document.getElementById('message').style.color = '#ff3366';
          return; 
        }

        const msg = document.getElementById('message');
        if (base === selectedBase.dataset.correct) {
          selectedBase.textContent = base;
          selectedBase.className = `base ${base} fixed`;
          selectedBase.style.boxShadow = '';
          score += 20;
          fixed++;
          msg.textContent = '✅ Correct repair!';
          msg.style.color = '#00cc66';
          
          // ✅ FIXED: Add success animation
          msg.style.fontWeight = 'bold';
          setTimeout(() => { msg.style.fontWeight = '500'; }, 1000);
        } else {
          score = Math.max(0, score - 5);
          msg.textContent = '❌ Wrong base! Check pairing rules.';
          msg.style.color = '#ff3366';
        }

        document.getElementById('score').textContent = score;
        document.getElementById('fixed').textContent = fixed;
        selectedBase = null;

        if (fixed === errors.length) {
          setTimeout(() => { 
            msg.textContent = '🎉 DNA repaired! +50 bonus!'; 
            score += 50; 
            document.getElementById('score').textContent = score; 
            msg.style.color = '#00ff88';
          }, 500);
        }
      }

      // ✅ FIXED: Initialize with error handling
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    } catch (error) {
      console.error('DNA Repair Puzzle Error:', error);
      document.body.innerHTML = '<div style="color: #ff3366; padding: 40px; text-align: center;"><h2>⚠️ Game Error</h2><p>Sorry, the game failed to load. Please refresh the page.</p></div>';
    }
  </script>
    <script>

            setTimeout(function() {
                var loading = document.getElementById("loading-screen") || document.querySelector(".loading-screen");
                if (loading && !loading.classList.contains("fade-out")) {
                    loading.style.display = "none";
                }
            }, 5000);
        });
