      display: flex;

      flex-wrap: wrap;
      justify-content: center;

    .cell-diagram {
      position: relative;
      width: 350px;
      height: 350px;
      background: #f0f9ff;
      border-radius: 50%;
      border: 8px solid #00c8ff;
    }
    .cell-part {
      position: absolute;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;

    }
    .nucleus {
      width: 100px;

      background: linear-gradient(135deg, #8b5cf6, #6d28d9);

    }
    .mitochondria {

    }
    .ribosome {

      border-radius: 50%;
      top: 70%;
      left: 25%;

    }
    .membrane {
      width: 100%;

    .message.success { background: #dcfce7; color: #16a34a; }

<body>
    <nav class="nav-bar" id="main-nav"></nav>
  <div class="container">
    <header>
      <h1>Cell Detective</h1>
      <p class="subtitle">Can you find all the parts of a cell?</p>
    </header>

    <div class="game-area">
      <div class="instructions">
        Click a label on the right, then click the matching cell part!
      </div>

      <div class="cell-container">
        <div class="cell-diagram">
          <div class="cell-part membrane" data-part="membrane">?</div>
          <div class="cell-part nucleus" data-part="nucleus">?</div>
          <div class="cell-part mitochondria" data-part="mitochondria">?</div>
          <div class="cell-part ribosome" data-part="ribosome">?</div>
          <div class="cell-part vacuole" data-part="vacuole">?</div>
          <div class="cell-part er" data-part="er">?</div>
        </div>

        <div class="labels-area">
          <button class="label-btn" data-label="nucleus">Nucleus (Brain)</button>
          <button class="label-btn" data-label="mitochondria">Mitochondria (Power)</button>
          <button class="label-btn" data-label="membrane">Cell Membrane</button>
          <button class="label-btn" data-label="ribosome">Ribosome</button>
          <button class="label-btn" data-label="vacuole">Vacuole (Storage)</button>
          <button class="label-btn" data-label="er">ER (Factory)</button>
        </div>
      </div>

      <div class="score-bar">
        <span class="score">Score: <span id="score">0</span> / 6</span>
      </div>

      <div class="message" id="message"></div>
    </div>

    <center><a href="index.html" class="back-btn">Back to Discovery Zone</a></center>
  </div>

  <script>
    let selectedLabel = null;
    let score = 0;
    const matched = new Set();

    const labels = document.querySelectorAll('.label-btn');
    const parts = document.querySelectorAll('.cell-part');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    const partNames = {
      nucleus: 'Nucleus',
      mitochondria: 'Mitochondria',
      membrane: 'Membrane',
      ribosome: 'Ribosome',
      vacuole: 'Vacuole',
      er: 'ER'
    };

    labels.forEach(btn => {
      btn.addEventListener('click', () => {
        labels.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedLabel = btn.dataset.label;
        showMessage('Now click the matching cell part!', 'hint');
      });
    });

    parts.forEach(part => {
      part.addEventListener('click', () => {
        if (!selectedLabel) {
          showMessage('First, click a label on the right!', 'hint');
          return;
        }

        if (matched.has(part.dataset.part)) return;

        if (part.dataset.part === selectedLabel) {
          // Correct!
          part.textContent = partNames[selectedLabel];
          part.classList.add('correct');
          matched.add(selectedLabel);
          score++;
          scoreEl.textContent = score;

          document.querySelector(`[data-label="${selectedLabel}"]`).classList.add('used');

          if (score === 6) {
            showMessage('Amazing! You found all the cell parts! You are a Cell Detective!', 'success');
          } else {
            showMessage('Correct! Great job!', 'success');
          }

          selectedLabel = null;
          labels.forEach(b => b.classList.remove('selected'));
        } else {
          showMessage('Not quite! Try again!', 'hint');
        }
      });
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = 'message show ' + type;
    }
  </script>
