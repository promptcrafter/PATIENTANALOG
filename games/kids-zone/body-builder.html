    .drop-zone[data-organ="lungs"] { width: 100px; height: 60px; top: 110px; left: 50%; transform: translateX(-50%); }

<body>
    <nav class="nav-bar" id="main-nav"></nav>
  <div class="container">
    <header>
      <h1>Body Builder</h1>
      <p class="subtitle">Put the organs in the right place to build a healthy body!</p>
    </header>

    <div class="game-area">
      <div class="instructions">
        Drag each organ and drop it in the correct spot on the body!
      </div>

      <div class="game-layout">
        <div class="body-outline">
          <div class="drop-zone" data-organ="brain">🧠</div>
          <div class="drop-zone" data-organ="lungs">🫁</div>
          <div class="drop-zone" data-organ="heart">❤️</div>
          <div class="drop-zone" data-organ="liver">🫀</div>
          <div class="drop-zone" data-organ="stomach">🟤</div>
          <div class="drop-zone" data-organ="kidneys">🫘</div>
        </div>

        <div class="organs-tray" id="organs-tray">
          <div class="organ" draggable="true" data-organ="brain">
            <span class="organ-emoji">🧠</span> Brain
          </div>
          <div class="organ" draggable="true" data-organ="heart">
            <span class="organ-emoji">❤️</span> Heart
          </div>
          <div class="organ" draggable="true" data-organ="lungs">
            <span class="organ-emoji">🫁</span> Lungs
          </div>
          <div class="organ" draggable="true" data-organ="stomach">
            <span class="organ-emoji">🟤</span> Stomach
          </div>
          <div class="organ" draggable="true" data-organ="liver">
            <span class="organ-emoji">🫀</span> Liver
          </div>
          <div class="organ" draggable="true" data-organ="kidneys">
            <span class="organ-emoji">🫘</span> Kidneys
          </div>
        </div>
      </div>

      <div class="score-bar">
        <span class="score">Organs Placed: <span id="score">0</span> / 6</span>
        <br><button class="reset-btn" onclick="resetGame()">Start Over</button>
      </div>

      <div class="message" id="message"></div>
    </div>

    <center><a href="index.html" class="back-btn">Back to Discovery Zone</a></center>
  </div>

  <script>
    let score = 0;
    let draggedOrgan = null;

    const organs = document.querySelectorAll('.organ');
    const dropZones = document.querySelectorAll('.drop-zone');

    organs.forEach(organ => {
      organ.addEventListener('dragstart', (e) => {
        draggedOrgan = organ;
        organ.classList.add('dragging');
      });

      organ.addEventListener('dragend', () => {
        organ.classList.remove('dragging');
        draggedOrgan = null;
        dropZones.forEach(zone => zone.classList.remove('highlight'));
      });
    });

    dropZones.forEach(zone => {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('highlight');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('highlight');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('highlight');

        if (!draggedOrgan) return;
        if (zone.classList.contains('correct')) return;

        const organType = draggedOrgan.dataset.organ;
        const zoneType = zone.dataset.organ;

        if (organType === zoneType) {
          // Correct placement
          zone.classList.add('correct');
          zone.innerHTML = draggedOrgan.innerHTML;
          draggedOrgan.classList.add('placed');
          score++;
          document.getElementById('score').textContent = score;

          if (score === 6) {
            showMessage('Amazing! You built a complete body! All organs are in place!', 'success');
          }
        } else {
          // Wrong placement - shake animation
          zone.style.animation = 'shake 0.3s';
          setTimeout(() => zone.style.animation = '', 300);
        }
      });
    });

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message show ' + type;
    }

    function resetGame() {
      score = 0;
      document.getElementById('score').textContent = 0;
      document.getElementById('message').className = 'message';

      organs.forEach(organ => organ.classList.remove('placed'));

      dropZones.forEach(zone => {
        zone.classList.remove('correct');
        const type = zone.dataset.organ;
        const emojis = { brain: '🧠', heart: '❤️', lungs: '🫁', stomach: '🟤', liver: '🫀', kidneys: '🫘' };
        zone.innerHTML = emojis[type];
      });
    }

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(-50%); }
        25% { transform: translateX(calc(-50% - 10px)); }
        75% { transform: translateX(calc(-50% + 10px)); }
      }
    `;
    document.head.appendChild(style);
  </script>
