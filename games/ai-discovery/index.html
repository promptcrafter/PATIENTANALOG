    <h1>🧠 AI Drug Discovery Puzzle</h1>
    <p class="subtitle">Train your neural network - match molecules to targets!</p>

    <div class="accuracy">Accuracy: <span id="accuracy">0</span>%</div>

    <div class="neural-viz">🔵 → ⚡ Neural Network Processing ⚡ → 🎯</div>

    <div class="game-area">
      <div class="column">
        <div class="column-title">Molecules</div>
        <div class="molecule" data-type="kinase" onclick="selectMol(this)">🧪 Kinase Inhibitor</div>
        <div class="molecule" data-type="receptor" onclick="selectMol(this)">💊 GPCR Agonist</div>
        <div class="molecule" data-type="enzyme" onclick="selectMol(this)">⚗️ Enzyme Blocker</div>
        <div class="molecule" data-type="antibody" onclick="selectMol(this)">🛡️ Monoclonal Ab</div>
      </div>
      <div class="arrow">→</div>
      <div class="column">
        <div class="column-title">Targets</div>
        <div class="target" data-type="enzyme" onclick="selectTarget(this)">🎯 Protease</div>
        <div class="target" data-type="kinase" onclick="selectTarget(this)">🎯 Tyrosine Kinase</div>
        <div class="target" data-type="antibody" onclick="selectTarget(this)">🎯 PD-L1</div>
        <div class="target" data-type="receptor" onclick="selectTarget(this)">🎯 Serotonin 5-HT</div>
      </div>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    // ✅ FIXED: Added error boundary
    try {
      let selectedMol = null;
      let selectedTarget = null;
      let matches = 0;
      const total = 4;

      function selectMol(el) {
        if (el.classList.contains('matched')) return;
        document.querySelectorAll('.molecule').forEach(m => m.classList.remove('selected'));
        el.classList.add('selected');
        selectedMol = el;
        checkMatch();
      }

      function selectTarget(el) {
        if (el.classList.contains('matched')) return;
        document.querySelectorAll('.target').forEach(t => t.classList.remove('selected'));
        el.classList.add('selected');
        selectedTarget = el;
        checkMatch();
      }

      function checkMatch() {
        if (!selectedMol || !selectedTarget) return;

        const msg = document.getElementById('message');
        if (selectedMol.dataset.type === selectedTarget.dataset.type) {
          selectedMol.classList.add('matched');
          selectedTarget.classList.add('matched');
          matches++;
          msg.textContent = '✅ Correct binding! Neural network trained.';
          msg.style.color = '#00cc66';
        } else {
          msg.textContent = '❌ Poor binding affinity. Try again!';
          msg.style.color = '#ff3366';
        }

        const accuracy = Math.round((matches / total) * 100);
        document.getElementById('accuracy').textContent = accuracy;

        selectedMol.classList.remove('selected');
        selectedTarget.classList.remove('selected');
        selectedMol = null;
        selectedTarget = null;

        if (matches === total) {
          setTimeout(() => { 
            msg.textContent = '🎉 AI fully trained! Drug candidates identified!'; 
            msg.style.color = '#00ff88';
          }, 500);
        }
      }
    } catch (error) {
      console.error('AI Drug Discovery Error:', error);
      document.body.innerHTML = '<div style="color: #ff3366; padding: 40px; text-align: center;"><h2>⚠️ Game Error</h2><p>Sorry, the game failed to load. Please refresh the page.</p></div>';
    }
  </script>
    <script>
        /* Error handling */
        window.addEventListener("error", function(e) {
            console.error("Game error:", e.error);

        /* Ensure loading screen disappears */
        window.addEventListener("load", function() {
            setTimeout(function() {
                var loading = document.getElementById("loading-screen") || document.querySelector(".loading-screen");
                if (loading && !loading.classList.contains("fade-out")) {
                    loading.style.display = "none";
                }
            }, 5000);
        });
    </script>
