    <div class="container">
        <header>
            <h1>🧬 Protein Folding Dynamics</h1>
            <p class="subtitle">Amino Acid Chain 3D Structure Formation</p>
        </header>

        <div class="main-display">
            <div id="canvas-container">
                <canvas id="protein-canvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Protein Selection</h3>
                    <select id="protein-select" onchange="selectProtein(this.value)">
                        <option value="">Select protein...</option>
                        <option value="hemoglobin">Hemoglobin</option>
                        <option value="insulin">Insulin</option>
                        <option value="lysozyme">Lysozyme</option>
                        <option value="myoglobin">Myoglobin</option>
                        <option value="collagen">Collagen (Triple Helix)</option>
                        <option value="antibody">Antibody (IgG)</option>
                    </select>
                </div>

                <div class="control-section">
                    <h3>Folding Parameters</h3>
                    <div class="slider-group">
                        <label>Temperature: <span id="temp-val">37</span>°C</label>
                        <input type="range" id="temperature" min="20" max="80" value="37" 
                               oninput="updateTemp(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>pH Level: <span id="ph-val">7.4</span></label>
                        <input type="range" id="ph" min="4" max="10" step="0.1" value="7.4" 
                               oninput="updatePH(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Ionic Strength: <span id="ionic-val">150</span> mM</label>
                        <input type="range" id="ionic" min="50" max="300" value="150" 
                               oninput="updateIonic(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Folding Progress: <span id="progress-val">0</span>%</label>
                        <input type="range" id="progress" min="0" max="100" value="0" 
                               oninput="updateProgress(this.value)">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Visualization</h3>
                    <button onclick="setView('ribbon')" id="btn-ribbon"><span>🎀 Ribbon</span></button>
                    <button onclick="setView('space-filling')" id="btn-space"><span>⚫ Space-Filling</span></button>
                    <button onclick="setView('backbone')" id="btn-backbone" class="active"><span>🔗 Backbone</span></button>
                </div>

                <div class="control-section">
                    <button onclick="toggleAnimation()"><span>⏯️ Play/Pause</span></button>
                    <button onclick="resetFolding()"><span>🔄 Reset</span></button>
                </div>

                <div class="info-panel">
                    <h3 style="color: #88ffaa; margin-bottom: 10px;">Energy & Stability</h3>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-label">Free Energy</div>
                            <div class="stat-value" id="energy">0 kJ/mol</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Stability</div>
                            <div class="stat-value" id="stability">--</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">α-Helix</div>
                            <div class="stat-value" id="helix">0%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">β-Sheet</div>
                            <div class="stat-value" id="sheet">0%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, protein;
        let aminoAcids = [];
        let bonds = [];
        let currentProtein = null;
        let temperature = 37;
        let pH = 7.4;
        let ionicStrength = 150;
        let foldingProgress = 0;
        let viewMode = 'backbone';
        let isAnimating = true;

        const proteinData = {
            hemoglobin: { name: "Hemoglobin", residues: 140, helixContent: 75, sheetContent: 0, color: 0xff4444 },
            insulin: { name: "Insulin", residues: 51, helixContent: 50, sheetContent: 10, color: 0x4444ff },
            lysozyme: { name: "Lysozyme", residues: 129, helixContent: 40, sheetContent: 10, color: 0x44ff44 },
            myoglobin: { name: "Myoglobin", residues: 153, helixContent: 80, sheetContent: 0, color: 0xff44ff },
            collagen: { name: "Collagen", residues: 1000, helixContent: 0, sheetContent: 0, color: 0xffff44 },
            antibody: { name: "Antibody", residues: 450, helixContent: 5, sheetContent: 60, color: 0x44ffff }
        };

        function init() {
            const canvas = document.getElementById('protein-canvas');
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x0a1a0a, 1);

            addLighting();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function selectProtein(proteinId) {
            if (!proteinId) return;
            currentProtein = proteinData[proteinId];
            createProteinStructure();
            updateStats();
        }

        function createProteinStructure() {
            aminoAcids.forEach(aa => scene.remove(aa));
            bonds.forEach(bond => scene.remove(bond));
            aminoAcids = [];
            bonds = [];

            const count = Math.min(currentProtein.residues, 150);
            const radius = 10;

            for (let i = 0; i < count; i++) {
                const geometry = new THREE.SphereGeometry(0.3, 8, 8);
                const material = new THREE.MeshPhongMaterial({
                    color: currentProtein.color,
                    emissive: currentProtein.color,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.9
                });
                const aa = new THREE.Mesh(geometry, material);

                const t = (i / count) * Math.PI * 4;
                const helixRadius = 3 + Math.sin(t * 2) * 2;
                
                aa.position.x = helixRadius * Math.cos(t * (1 - foldingProgress / 100));
                aa.position.y = (i - count / 2) * 0.15 * (1 + foldingProgress / 50);
                aa.position.z = helixRadius * Math.sin(t * (1 - foldingProgress / 100));

                aa.userData = { index: i, originalPos: aa.position.clone() };
                scene.add(aa);
                aminoAcids.push(aa);

                if (i > 0) {
                    const prevAA = aminoAcids[i - 1];
                    const bondGeometry = new THREE.CylinderGeometry(0.1, 0.1, 
                        aa.position.distanceTo(prevAA.position), 8);
                    const bondMaterial = new THREE.MeshPhongMaterial({ 
                        color: 0x88ffaa, 
                        transparent: true, 
                        opacity: 0.85 
                    });
                    const bond = new THREE.Mesh(bondGeometry, bondMaterial);
                    
                    bond.position.copy(aa.position).add(prevAA.position).multiplyScalar(0.5);
                    bond.lookAt(prevAA.position);
                    bond.rotateX(Math.PI / 2);
                    
                    scene.add(bond);
                    bonds.push(bond);
                }
            }
        }

        function updateProgress(value) {
            foldingProgress = parseInt(value);
            document.getElementById('progress-val').textContent = value;
            
            if (currentProtein) {
                createProteinStructure();
                updateStats();
            }
        }

        function updateTemp(value) {
            temperature = parseInt(value);
            document.getElementById('temp-val').textContent = value;
            updateStats();
        }

        function updatePH(value) {
            pH = parseFloat(value);
            document.getElementById('ph-val').textContent = value;
            updateStats();
        }

        function updateIonic(value) {
            ionicStrength = parseInt(value);
            document.getElementById('ionic-val').textContent = value;
            updateStats();
        }

        function updateStats() {
            if (!currentProtein) return;

            const tempFactor = Math.max(0, 1 - Math.abs(temperature - 37) / 40);
            const phFactor = Math.max(0, 1 - Math.abs(pH - 7.4) / 3);
            const stability = (tempFactor * phFactor * (foldingProgress / 100) * 100).toFixed(1);
            
            const energy = -50 * (foldingProgress / 100) * tempFactor * phFactor;
            
            document.getElementById('energy').textContent = energy.toFixed(1) + ' kJ/mol';
            document.getElementById('stability').textContent = stability > 70 ? 'Stable' : 
                                                              stability > 40 ? 'Partial' : 'Unstable';
            document.getElementById('helix').textContent = 
                Math.round(currentProtein.helixContent * (foldingProgress / 100)) + '%';
            document.getElementById('sheet').textContent = 
                Math.round(currentProtein.sheetContent * (foldingProgress / 100)) + '%';
        }

        function setView(mode) {
            viewMode = mode;
            document.querySelectorAll('.control-section button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('btn-' + mode.split('-')[0]).classList.add('active');

            aminoAcids.forEach(aa => {
                if (mode === 'space-filling') {
                    aa.scale.set(2, 2, 2);
                    aa.material.opacity = 1;
                } else if (mode === 'ribbon') {
                    aa.scale.set(0.5, 1, 0.5);
                    aa.material.opacity = 0.8;
                } else {
                    aa.scale.set(1, 1, 1);
                    aa.material.opacity = 0.9;
                }
            });

            bonds.forEach(bond => {
                bond.visible = (mode === 'backbone' || mode === 'ribbon');
            });
        }

        function addLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x44ff88, 1.5, 100);
            pointLight1.position.set(15, 15, 15);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x88ffaa, 1, 100);
            pointLight2.position.set(-15, -15, 15);
            scene.add(pointLight2);
        }

        function animate() {
            if (!isAnimating) return;
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            aminoAcids.forEach((aa, i) => {
                aa.rotation.x += 0.01;
                aa.rotation.y += 0.01;
                
                const wobble = Math.sin(time * 2 + i * 0.1) * 0.05 * (temperature / 37);
                aa.position.x += wobble * Math.cos(i);
                aa.position.z += wobble * Math.sin(i);
            });

            renderer.render(scene, camera);
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            if (isAnimating) animate();
        }

        function resetFolding() {
            foldingProgress = 0;
            temperature = 37;
            pH = 7.4;
            ionicStrength = 150;
            
            document.getElementById('progress').value = 0;
            document.getElementById('temperature').value = 37;
            document.getElementById('ph').value = 7.4;
            document.getElementById('ionic').value = 150;
            
            updateProgress(0);
            updateTemp(37);
            updatePH(7.4);
            updateIonic(150);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        init();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchmove', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchend', function(e) {
              e.preventDefault();
              canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, {passive: false});
          });
        })();
        /* ===== END MOBILE TOUCH SUPPORT ===== */
    </script>
