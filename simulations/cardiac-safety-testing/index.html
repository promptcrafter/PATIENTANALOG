        <div class="metrics">

            <div class="metric-card">
                <div class="metric-label">Contractility</div>
                <div class="metric-value normal" id="contractility">Normal</div>

        <div class="main-display">
            <div id="canvas-container">

            <div class="controls">
                <div class="control-section">
                    <h3>Drug Compounds</h3>
                    <select id="drug-select" onchange="selectDrug(this.value)">

                        <option value="dofetilide">Dofetilide (hERG blocker)</option>
                        <option value="quinidine">Quinidine</option>
                        <option value="erythromycin">Erythromycin</option>
                        <option value="cisapride">Cisapride</option>
                        <option value="sotalol">Sotalol</option>
                        <option value="doxorubicin">Doxorubicin</option>

                    <div class="slider-group">
                        <label>Concentration: <span id="conc-val">0</span> nM</label>
                        <input type="range" id="concentration" min="0" max="1000" value="0" 
                               oninput="updateConcentration(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Exposure Time: <span id="exp-time-val">0</span> hours</label>
                        <input type="range" id="exposure-time" min="0" max="48" value="0" 
                               oninput="updateExposureTime(this.value)">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Cardiac Assays</h3>
                    <button onclick="runAssay('herg')"><span>🧬 hERG Channel</span></button>
                    <button onclick="runAssay('mea')"><span>📊 MEA Recording</span></button>
                    <button onclick="runAssay('contraction')"><span>💪 Contractility</span></button>
                    <button onclick="runAssay('calcium')"><span>⚡ Ca²⁺ Transients</span></button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, heart;
        let cardiomyocytes = [];
        let currentDrug = null;
        let concentration = 0;
        let exposureTime = 0;
        let heartRate = 72;
        let qtInterval = 400;
        let ecgCanvas, ecgCtx;
        let ecgData = [];
        let ecgTime = 0;

        const drugData = {
            dofetilide: { name: "Dofetilide", hergBlock: 90, qtProlong: 50, color: 0xff4466 },
            quinidine: { name: "Quinidine", hergBlock: 70, qtProlong: 40, color: 0xff6688 },
            erythromycin: { name: "Erythromycin", hergBlock: 50, qtProlong: 30, color: 0xff88aa },
            cisapride: { name: "Cisapride", hergBlock: 80, qtProlong: 45, color: 0xff4488 },
            sotalol: { name: "Sotalol", hergBlock: 60, qtProlong: 35, color: 0xff6644 },
            doxorubicin: { name: "Doxorubicin", hergBlock: 40, qtProlong: 25, color: 0xff0044 },
            trastuzumab: { name: "Trastuzumab", hergBlock: 20, qtProlong: 10, color: 0xff8844 },
            verapamil: { name: "Verapamil", hergBlock: 30, qtProlong: 15, color: 0xffaa66 }
        };

        function init() {
            const canvas = document.getElementById('heart-canvas');
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x0a0a1a, 1);

            createHeart();
            createCardiomyocytes(50);
            addLighting();

            ecgCanvas = document.getElementById('ecg-canvas');
            ecgCtx = ecgCanvas.getContext('2d');
            ecgCanvas.width = ecgCanvas.offsetWidth;
            ecgCanvas.height = ecgCanvas.offsetHeight;

            window.addEventListener('resize', onWindowResize);
            animate();
            animateECG();
        }

        function createHeart() {
            const geometry = new THREE.SphereGeometry(3, 32, 32);
            geometry.scale(1, 1.2, 0.8);
            
            const material = new THREE.MeshPhongMaterial({
                color: 0xff4466,
                emissive: 0x882233,
                transparent: true,
                opacity: 0.6,
                shininess: 100
            });
            heart = new THREE.Mesh(geometry, material);
            scene.add(heart);
        }

        function createCardiomyocytes(count) {
            for (let i = 0; i < count; i++) {
                const geometry = new THREE.BoxGeometry(0.3, 0.6, 0.2);
                const material = new THREE.MeshPhongMaterial({
                    color: 0xff88aa,
                    emissive: 0xff4466,
                    transparent: true,
                    opacity: 0.7
                });
                const cell = new THREE.Mesh(geometry, material);

                const angle = (i / count) * Math.PI * 2;
                const radius = 3.5 + Math.random() * 0.5;
                cell.position.x = Math.cos(angle) * radius;
                cell.position.y = Math.sin(angle) * radius * 1.2;
                cell.position.z = (Math.random() - 0.5) * 2;

                cell.userData = { phase: Math.random() * Math.PI * 2, health: 100 };
                scene.add(cell);
                cardiomyocytes.push(cell);
            }
        }

        function addLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xff4466, 1.5, 100);
            pointLight1.position.set(10, 10, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff88aa, 1, 100);
            pointLight2.position.set(-10, -10, 10);
            scene.add(pointLight2);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            if (heart) {
                const beat = Math.sin(time * (heartRate / 60) * Math.PI * 2);
                const scale = 1 + beat * 0.15;
                heart.scale.set(scale, scale * 1.2, scale * 0.8);
                heart.rotation.y += 0.002;
            }

            cardiomyocytes.forEach((cell) => {
                const beat = Math.sin(time * (heartRate / 60) * Math.PI * 2 + cell.userData.phase);
                cell.scale.set(1, 1 + beat * 0.3, 1);
                cell.material.emissiveIntensity = 0.5 + beat * 0.5;
            });

            renderer.render(scene, camera);
        }

        function animateECG() {
            requestAnimationFrame(animateECG);
            
            ecgCtx.fillStyle = 'rgba(10, 10, 26, 0.1)';
            ecgCtx.fillRect(0, 0, ecgCanvas.width, ecgCanvas.height);

            ecgCtx.strokeStyle = '#ff4466';
            ecgCtx.lineWidth = 2;
            ecgCtx.beginPath();

            const centerY = ecgCanvas.height / 2;
            const amplitude = 60;
            const speed = (heartRate / 60) * 5;

            for (let x = 0; x < ecgCanvas.width; x++) {
                const t = (ecgTime + x) * 0.01 * speed;
                const phase = t % (2 * Math.PI);
                
                let y = 0;
                if (phase < 0.1) y = Math.sin(phase * 10 * Math.PI) * amplitude * 0.2;
                else if (phase < 0.2) y = Math.sin((phase - 0.1) * 10 * Math.PI) * amplitude * 1.5;
                else if (phase < 0.35) y = -Math.sin((phase - 0.2) * 6 * Math.PI) * amplitude * 0.8;
                else if (phase < 0.5) y = Math.sin((phase - 0.35) * 6 * Math.PI) * amplitude * 0.4;

                if (x === 0) ecgCtx.moveTo(x, centerY - y);
                else ecgCtx.lineTo(x, centerY - y);
            }

            ecgCtx.stroke();
            ecgTime += 1;
        }

        function selectDrug(drugId) {
            if (!drugId) return;
            currentDrug = drugData[drugId];
            updateCardiacEffects();
        }

        function updateConcentration(value) {
            concentration = parseInt(value);
            document.getElementById('conc-val').textContent = value;
            updateCardiacEffects();
        }

        function updateExposureTime(value) {
            exposureTime = parseInt(value);
            document.getElementById('exp-time-val').textContent = value;
            updateCardiacEffects();
        }

        function updateCardiacEffects() {
            if (!currentDrug) return;

            const potency = (concentration / 1000) * (exposureTime / 48);
            const hergInhibition = Math.min(currentDrug.hergBlock * potency, 100);
            const qtProlongation = Math.min(currentDrug.qtProlong * potency, 50);

            qtInterval = 400 + qtProlongation * 4;
            heartRate = Math.max(40, 72 - hergInhibition * 0.3);

            document.getElementById('heart-rate').textContent = Math.round(heartRate) + ' BPM';
            document.getElementById('qt-interval').textContent = Math.round(qtInterval) + ' ms';
            document.getElementById('herg').textContent = Math.round(hergInhibition) + '%';

            const contractilityStatus = hergInhibition < 30 ? 'Normal' : 
                                       hergInhibition < 60 ? 'Reduced' : 'Severely Impaired';
            document.getElementById('contractility').textContent = contractilityStatus;

            document.getElementById('heart-rate').className = 'metric-value ' + 
                (heartRate > 60 ? 'normal' : heartRate > 50 ? 'warning' : 'danger');
            document.getElementById('qt-interval').className = 'metric-value ' + 
                (qtInterval < 440 ? 'normal' : qtInterval < 480 ? 'warning' : 'danger');
            document.getElementById('herg').className = 'metric-value ' + 
                (hergInhibition < 30 ? 'normal' : hergInhibition < 60 ? 'warning' : 'danger');
            document.getElementById('contractility').className = 'metric-value ' + 
                (hergInhibition < 30 ? 'normal' : hergInhibition < 60 ? 'warning' : 'danger');
        }

        function runAssay(assayType) {
            const assays = {
                herg: 'hERG Channel Assay',
                mea: 'Multi-Electrode Array',
                contraction: 'Contractility Measurement',
                calcium: 'Calcium Transient'
            };
            alert(`Running ${assays[assayType]} - Results updated`);
        }

        function resetSimulation() {
            currentDrug = null;
            concentration = 0;
            exposureTime = 0;
            heartRate = 72;
            qtInterval = 400;
            
            document.getElementById('drug-select').value = '';
            document.getElementById('concentration').value = 0;
            document.getElementById('exposure-time').value = 0;
            updateConcentration(0);
            updateExposureTime(0);
            
            document.getElementById('heart-rate').textContent = '72 BPM';
            document.getElementById('qt-interval').textContent = '400 ms';
            document.getElementById('contractility').textContent = 'Normal';
            document.getElementById('herg').textContent = '0%';
            
            document.querySelectorAll('.metric-value').forEach(el => {
                el.className = 'metric-value normal';
            });
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            
            ecgCanvas.width = ecgCanvas.offsetWidth;
            ecgCanvas.height = ecgCanvas.offsetHeight;
        }

        init();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchmove', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchend', function(e) {
              e.preventDefault();
              canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, {passive: false});
          });
        })();
        /* ===== END MOBILE TOUCH SUPPORT ===== */
    </script>
