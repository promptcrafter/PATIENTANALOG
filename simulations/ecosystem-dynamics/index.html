<body>

    <div class="container">
        <header>
            <h1>Ecosystem Dynamics</h1>
            <p class="subtitle">Lotka-Volterra Predator-Prey Population Modeling</p>
        </header>

        <div class="main-grid">
            <div id="canvas-container">
                <canvas id="ecosystem-canvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Species Parameters</h3>
                    <div class="slider-group">
                        <label>Prey Birth Rate: <span id="prey-birth-val">0.1</span></label>
                        <input type="range" id="prey-birth" min="0" max="0.5" step="0.01" value="0.1" 
                               oninput="updatePreyBirth(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Predation Rate: <span id="predation-val">0.02</span></label>
                        <input type="range" id="predation" min="0" max="0.1" step="0.001" value="0.02" 
                               oninput="updatePredation(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Predator Death Rate: <span id="pred-death-val">0.1</span></label>
                        <input type="range" id="pred-death" min="0" max="0.5" step="0.01" value="0.1" 
                               oninput="updatePredDeath(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Conversion Efficiency: <span id="efficiency-val">0.01</span></label>
                        <input type="range" id="efficiency" min="0" max="0.05" step="0.001" value="0.01" 
                               oninput="updateEfficiency(this.value)">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Scenarios</h3>
                    <button onclick="loadScenario('balanced')">Balanced Ecosystem</button>
                    <button onclick="loadScenario('collapse')">Predator Dominance</button>
                    <button onclick="loadScenario('boom')">Prey Boom</button>
                    <button onclick="loadScenario('cycles')">Oscillating Cycles</button>
                </div>

                <div class="pop-stats">
                    <h3 style="color: #aaff88; margin-bottom: 10px;">Population Levels</h3>
                    <div class="stat-row">
                        <span class="stat-label">Prey Population:</span>
                        <span class="stat-value" id="prey-pop">100</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Predator Population:</span>
                        <span class="stat-value" id="pred-pop">10</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Time Elapsed:</span>
                        <span class="stat-value" id="time-elapsed">0</span>
                    </div>
                    <div class="chart" id="population-chart"></div>
                </div>

                <div class="control-section">
                    <button onclick="toggleSimulation()">Play/Pause</button>
                    <button onclick="resetSimulation()">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let preyPop = 100, predPop = 10;
        let preyBirth = 0.1, predation = 0.02, predDeath = 0.1, efficiency = 0.01;
        let timeStep = 0;
        let isRunning = true;
        let history = { prey: [], pred: [] };
        const maxHistory = 200;

        function init() {
            canvas = document.getElementById('ecosystem-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = 600;
            animate();
        }

        function updatePreyBirth(v) { preyBirth = parseFloat(v); document.getElementById('prey-birth-val').textContent = v; }
        function updatePredation(v) { predation = parseFloat(v); document.getElementById('predation-val').textContent = v; }
        function updatePredDeath(v) { predDeath = parseFloat(v); document.getElementById('pred-death-val').textContent = v; }
        function updateEfficiency(v) { efficiency = parseFloat(v); document.getElementById('efficiency-val').textContent = v; }

        function animate() {
            requestAnimationFrame(animate);
            if (isRunning) {
                updatePopulations();
                draw();
            }
        }

        function updatePopulations() {
            const dt = 0.1;
            const dPrey = (preyBirth * preyPop - predation * preyPop * predPop) * dt;
            const dPred = (efficiency * predation * preyPop * predPop - predDeath * predPop) * dt;

            preyPop = Math.max(1, preyPop + dPrey);
            predPop = Math.max(1, predPop + dPred);

            history.prey.push(preyPop);
            history.pred.push(predPop);
            if (history.prey.length > maxHistory) {
                history.prey.shift();
                history.pred.shift();
            }

            timeStep++;
            document.getElementById('prey-pop').textContent = Math.round(preyPop);
            document.getElementById('pred-pop').textContent = Math.round(predPop);
            document.getElementById('time-elapsed').textContent = Math.round(timeStep * 0.1);
        }

        function draw() {
            ctx.fillStyle = '#1a2a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw prey (green circles)
            ctx.fillStyle = '#88ff44';
            for (let i = 0; i < Math.min(preyPop, 100); i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw predators (red triangles)
            ctx.fillStyle = '#ff4444';
            for (let i = 0; i < Math.min(predPop, 50); i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.moveTo(x, y - 8);
                ctx.lineTo(x - 6, y + 6);
                ctx.lineTo(x + 6, y + 6);
                ctx.closePath();
                ctx.fill();
            }

            // Draw population graph
            if (history.prey.length > 1) {
                const graphHeight = 150;
                const graphY = canvas.height - graphHeight - 20;
                const scale = graphHeight / Math.max(...history.prey, ...history.pred, 200);

                ctx.strokeStyle = '#88ff44';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < history.prey.length; i++) {
                    const x = (i / maxHistory) * canvas.width;
                    const y = graphY + graphHeight - history.prey[i] * scale;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                ctx.strokeStyle = '#ff4444';
                ctx.beginPath();
                for (let i = 0; i < history.pred.length; i++) {
                    const x = (i / maxHistory) * canvas.width;
                    const y = graphY + graphHeight - history.pred[i] * scale;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
        }

        function loadScenario(type) {
            const scenarios = {
                balanced: { prey: 100, pred: 10, birth: 0.1, predation: 0.02, death: 0.1, eff: 0.01 },
                collapse: { prey: 50, pred: 30, birth: 0.05, predation: 0.05, death: 0.05, eff: 0.02 },
                boom: { prey: 200, pred: 5, birth: 0.15, predation: 0.01, death: 0.15, eff: 0.005 },
                cycles: { prey: 100, pred: 10, birth: 0.12, predation: 0.025, death: 0.12, eff: 0.015 }
            };
            const s = scenarios[type];
            preyPop = s.prey; predPop = s.pred;
            preyBirth = s.birth; predation = s.predation; predDeath = s.death; efficiency = s.eff;
            document.getElementById('prey-birth').value = s.birth; updatePreyBirth(s.birth);
            document.getElementById('predation').value = s.predation; updatePredation(s.predation);
            document.getElementById('pred-death').value = s.death; updatePredDeath(s.death);
            document.getElementById('efficiency').value = s.eff; updateEfficiency(s.eff);
            history = { prey: [], pred: [] };
            timeStep = 0;
        }

        function toggleSimulation() { isRunning = !isRunning; }
        function resetSimulation() { loadScenario('balanced'); }

        init();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchmove', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchend', function(e) {
              e.preventDefault();
              canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, {passive: false});
          });
        })();
        /* ===== END MOBILE TOUCH SUPPORT ===== */
    </script>
