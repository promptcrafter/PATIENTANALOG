    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a2a 0%, #2a1a4a 50%, #3a2a6a 100%);
            color: #fff;
            overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #aa44ff, #ff44aa, #44aaff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { font-size: 1.2em; color: #aa44ff; opacity: 0.9; }
        .main-display {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            margin-bottom: 30px;
        }
        #canvas-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(170, 68, 255, 0.4);
            min-height: 700px;
            position: relative;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .controls {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgba(255, 68, 170, 0.4);
        }
        .control-section { margin-bottom: 25px; }
        .control-section h3 {
            color: #ff44aa;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 2px solid rgba(255, 68, 170, 0.3);
            padding-bottom: 8px;
        }
        button {
            background: linear-gradient(135deg, #2a1a4a, #3a2a6a);
            color: #fff;
            border: 2px solid #aa44ff;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            border-color: #ff44aa;
            box-shadow: 0 0 20px rgba(170, 68, 255, 0.5);
            transform: translateY(-2px);
        }
        button.active {
            background: linear-gradient(135deg, #aa44ff, #ff44aa);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255, 68, 170, 0.8);

        }
        .slider-group { margin-bottom: 15px; }
        .slider-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff44aa;
            font-size: 0.9em;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: rgba(255, 68, 170, 0.2);

            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #aa44ff, #ff44aa);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 68, 170, 0.8);

            background: rgba(0, 0, 0, 0.7);

        select {

    <div class="container">
        <header>
            <h1>Gene Regulatory Network</h1>
            <p class="subtitle">Transcription Factor & Gene Expression Modeling</p>
        </header>

        <div class="main-display">
            <div id="canvas-container">
                <canvas id="network-canvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Network Pathways</h3>
                    <select id="pathway-select" onchange="selectPathway(this.value)">
                        <option value="">Select pathway...</option>
                        <option value="development">Cell Development</option>
                        <option value="stress">Stress Response</option>
                        <option value="metabolism">Metabolic Control</option>
                        <option value="differentiation">Stem Cell Differentiation</option>
                        <option value="immune">Immune Activation</option>
                        <option value="apoptosis">Apoptosis Cascade</option>
                    </select>
                </div>

                <div class="control-section">
                    <h3>Simulation Controls</h3>
                    <div class="slider-group">
                        <label>Transcription Rate: <span id="transcription-val">50</span>%</label>
                        <input type="range" id="transcription" min="0" max="100" value="50" 
                               oninput="updateTranscription(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Signal Strength: <span id="signal-val">50</span>%</label>
                        <input type="range" id="signal" min="0" max="100" value="50" 
                               oninput="updateSignal(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Feedback Loop: <span id="feedback-val">50</span>%</label>
                        <input type="range" id="feedback" min="0" max="100" value="50" 
                               oninput="updateFeedback(this.value)">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Active Genes</h3>
                    <div class="gene-list" id="gene-list"></div>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #44ff88;"></div>
                            <span>Activated</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #ff4444;"></div>
                            <span>Repressed</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #aa44ff;"></div>
                            <span>Neutral</span>
                        </div>
                    </div>
                </div>

                <div class="stats-panel">
                    <h3 style="color: #ff44aa; margin-bottom: 10px;">Network Activity</h3>
                    <div class="stat-grid">
                        <div class="stat-item">
                            <div class="stat-label">Active Genes</div>
                            <div class="stat-value" id="active-genes">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Interactions</div>
                            <div class="stat-value" id="interactions">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Expression</div>
                            <div class="stat-value" id="expression">0%</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Stability</div>
                            <div class="stat-value" id="stability">Stable</div>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <button onclick="toggleAnimation()">Play/Pause</button>
                    <button onclick="resetNetwork()">Reset Network</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let genes = [];
        let connections = [];
        let particles = [];
        let currentPathway = null;
        let transcriptionRate = 50;
        let signalStrength = 50;
        let feedbackLevel = 50;
        let isAnimating = true;

        const pathwayData = {
            development: {
                name: "Cell Development",
                genes: [
                    { name: "OCT4", type: "master", activation: 80 },
                    { name: "SOX2", type: "master", activation: 75 },
                    { name: "NANOG", type: "master", activation: 70 },
                    { name: "KLF4", type: "regulator", activation: 60 },
                    { name: "MYC", type: "regulator", activation: 55 },
                    { name: "PAX6", type: "effector", activation: 40 },
                    { name: "GATA4", type: "effector", activation: 35 }
                ],
                color: 0xaa44ff
            },
            stress: {
                name: "Stress Response",
                genes: [
                    { name: "HSF1", type: "master", activation: 90 },
                    { name: "HSP70", type: "effector", activation: 85 },
                    { name: "HSP90", type: "effector", activation: 80 },
                    { name: "ATF4", type: "regulator", activation: 70 },
                    { name: "CHOP", type: "effector", activation: 65 },
                    { name: "GRP78", type: "effector", activation: 60 }
                ],
                color: 0xff4444
            },
            metabolism: {
                name: "Metabolic Control",
                genes: [
                    { name: "PPARG", type: "master", activation: 75 },
                    { name: "SREBP1", type: "master", activation: 70 },
                    { name: "FOXO1", type: "regulator", activation: 65 },
                    { name: "PGC1A", type: "regulator", activation: 60 },
                    { name: "GLUT4", type: "effector", activation: 50 },
                    { name: "CPT1", type: "effector", activation: 45 }
                ],
                color: 0xffaa44
            },
            differentiation: {
                name: "Stem Cell Differentiation",
                genes: [
                    { name: "RUNX2", type: "master", activation: 85 },
                    { name: "MYOD", type: "master", activation: 80 },
                    { name: "BMP2", type: "regulator", activation: 75 },
                    { name: "WNT3A", type: "regulator", activation: 70 },
                    { name: "COL1A1", type: "effector", activation: 60 },
                    { name: "OSX", type: "effector", activation: 55 }
                ],
                color: 0x44aaff
            },
            immune: {
                name: "Immune Activation",
                genes: [
                    { name: "NFKB", type: "master", activation: 90 },
                    { name: "STAT3", type: "master", activation: 85 },
                    { name: "IRF3", type: "regulator", activation: 80 },
                    { name: "IL6", type: "effector", activation: 75 },
                    { name: "TNFA", type: "effector", activation: 70 },
                    { name: "IL1B", type: "effector", activation: 65 }
                ],
                color: 0xff8844
            },
            apoptosis: {
                name: "Apoptosis Cascade",
                genes: [
                    { name: "TP53", type: "master", activation: 95 },
                    { name: "BAX", type: "regulator", activation: 85 },
                    { name: "BCL2", type: "regulator", activation: -80 },
                    { name: "CASP9", type: "effector", activation: 75 },
                    { name: "CASP3", type: "effector", activation: 70 },
                    { name: "APAF1", type: "effector", activation: 65 }
                ],
                color: 0xff44aa
            }
        };

        function init() {
            const canvas = document.getElementById('network-canvas');
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 25;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x1a0a2a, 1);

            addLighting();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function selectPathway(pathwayId) {
            if (!pathwayId) return;
            currentPathway = pathwayData[pathwayId];
            createGeneNetwork();
            updateGeneList();
            updateStats();
        }

        function createGeneNetwork() {
            genes.forEach(g => scene.remove(g.mesh));
            connections.forEach(c => scene.remove(c));
            particles.forEach(p => scene.remove(p));
            genes = [];
            connections = [];
            particles = [];

            const geneCount = currentPathway.genes.length;
            const radius = 10;

            currentPathway.genes.forEach((geneData, i) => {
                const angle = (i / geneCount) * Math.PI * 2;
                const size = geneData.type === 'master' ? 0.6 : geneData.type === 'regulator' ? 0.4 : 0.3;
                
                const geometry = new THREE.SphereGeometry(size, 16, 16);
                const material = new THREE.MeshPhongMaterial({
                    color: currentPathway.color,
                    emissive: currentPathway.color,
                    emissiveIntensity: 0.4,
                    transparent: true,
                    opacity: 0.9
                });
                const mesh = new THREE.Mesh(geometry, material);

                mesh.position.x = Math.cos(angle) * radius;
                mesh.position.y = Math.sin(angle) * radius;
                mesh.position.z = (Math.random() - 0.5) * 3;

                scene.add(mesh);

                genes.push({
                    mesh: mesh,
                    data: geneData,
                    activation: 0,
                    targetActivation: 0
                });

                // Create connections to other genes
                if (i > 0) {
                    for (let j = 0; j < Math.min(i, 2); j++) {
                        const targetIndex = i - j - 1;
                        createConnection(i, targetIndex);
                    }
                }
            });
        }

        function createConnection(from, to) {
            const fromPos = genes[from].mesh.position;
            const toPos = genes[to].mesh.position;
            
            const points = [];
            points.push(new THREE.Vector3(fromPos.x, fromPos.y, fromPos.z));
            points.push(new THREE.Vector3(toPos.x, toPos.y, toPos.z));
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0xaa44ff,
                transparent: true,
                opacity: 0.90
            });
            const line = new THREE.Line(geometry, material);
            
            scene.add(line);
            connections.push(line);
        }

        function updateTranscription(value) {
            transcriptionRate = parseInt(value);
            document.getElementById('transcription-val').textContent = value;
            updateGeneActivation();
        }

        function updateSignal(value) {
            signalStrength = parseInt(value);
            document.getElementById('signal-val').textContent = value;
            updateGeneActivation();
        }

        function updateFeedback(value) {
            feedbackLevel = parseInt(value);
            document.getElementById('feedback-val').textContent = value;
            updateGeneActivation();
        }

        function updateGeneActivation() {
            if (!currentPathway) return;

            genes.forEach((gene, i) => {
                const baseActivation = gene.data.activation;
                const signal = (signalStrength / 100);
                const transcription = (transcriptionRate / 100);
                const feedback = (feedbackLevel / 100);

                gene.targetActivation = baseActivation * signal * transcription * (1 + feedback * 0.5);

                if (gene.targetActivation > 60) {
                    gene.mesh.material.color.setHex(0x44ff88);
                    gene.mesh.material.emissive.setHex(0x44ff88);
                } else if (gene.targetActivation < 30) {
                    gene.mesh.material.color.setHex(0xff4444);
                    gene.mesh.material.emissive.setHex(0xff4444);
                } else {
                    gene.mesh.material.color.setHex(currentPathway.color);
                    gene.mesh.material.emissive.setHex(currentPathway.color);
                }

                if (Math.random() < 0.02 && gene.targetActivation > 50) {
                    createSignalParticle(gene.mesh.position);
                }
            });

            updateGeneList();
            updateStats();
        }

        function createSignalParticle(position) {
            const geometry = new THREE.SphereGeometry(0.1, 8, 8);
            const material = new THREE.MeshPhongMaterial({
                color: 0xffaa44,
                emissive: 0xffaa44,
                transparent: true,
                opacity: 0.8
            });
            const particle = new THREE.Mesh(geometry, material);
            
            particle.position.copy(position);
            particle.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1
                ),
                life: 100
            };
            
            scene.add(particle);
            particles.push(particle);
        }

        function updateGeneList() {
            if (!currentPathway) return;
            
            const listEl = document.getElementById('gene-list');
            listEl.innerHTML = '';

            genes.forEach(gene => {
                const div = document.createElement('div');
                div.className = 'gene-item';
                
                if (gene.targetActivation > 60) div.classList.add('activated');
                else if (gene.targetActivation < 30) div.classList.add('repressed');

                div.innerHTML = `
                    <div class="gene-name">${gene.data.name}</div>
                    <div class="gene-level">Expression: ${Math.round(gene.targetActivation)}% | ${gene.data.type}</div>
                `;
                listEl.appendChild(div);
            });
        }

        function updateStats() {
            if (!currentPathway) return;

            const activeCount = genes.filter(g => g.targetActivation > 60).length;
            const avgExpression = genes.reduce((sum, g) => sum + g.targetActivation, 0) / genes.length;
            
            document.getElementById('active-genes').textContent = activeCount;
            document.getElementById('interactions').textContent = connections.length;
            document.getElementById('expression').textContent = Math.round(avgExpression) + '%';
            
            const stability = avgExpression > 70 ? 'High' : avgExpression > 40 ? 'Moderate' : 'Low';
            document.getElementById('stability').textContent = stability;
        }

        function addLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xaa44ff, 1.5, 100);
            pointLight1.position.set(15, 15, 15);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff44aa, 1, 100);
            pointLight2.position.set(-15, -15, 15);
            scene.add(pointLight2);
        }

        function animate() {
            if (!isAnimating) return;
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            genes.forEach((gene, i) => {
                gene.mesh.rotation.x += 0.01;
                gene.mesh.rotation.y += 0.01;

                gene.activation += (gene.targetActivation - gene.activation) * 0.05;

                const pulse = Math.sin(time * 3 + i) * 0.2 * (gene.activation / 100);
                gene.mesh.scale.set(1 + pulse, 1 + pulse, 1 + pulse);
                gene.mesh.material.emissiveIntensity = 0.3 + pulse;
            });

            particles.forEach((particle, i) => {
                particle.position.add(particle.userData.velocity);
                particle.userData.life -= 1;
                particle.material.opacity = particle.userData.life / 100;

                if (particle.userData.life <= 0) {
                    scene.remove(particle);
                    particles.splice(i, 1);
                }
            });

            connections.forEach((conn, i) => {
                const opacity = 0.2 + Math.sin(time * 2 + i) * 0.1;
                conn.material.opacity = opacity;
            });

            renderer.render(scene, camera);
        }

        function toggleAnimation() {
            isAnimating = !isAnimating;
            if (isAnimating) animate();
        }

        function resetNetwork() {
            transcriptionRate = 50;
            signalStrength = 50;
            feedbackLevel = 50;
            
            document.getElementById('transcription').value = 50;
            document.getElementById('signal').value = 50;
            document.getElementById('feedback').value = 50;
            
            updateTranscription(50);
            updateSignal(50);
            updateFeedback(50);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        init();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
