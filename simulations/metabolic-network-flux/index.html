<body>
    <!-- NAV BAR -->
    <nav class="nav-bar" id="main-nav"></nav>
    <div id="live-ticker"></div>
    <div class="container">
        <header>
            <h1>Metabolic Network Flux</h1>
            <p class="subtitle">Cellular Energy Production & Pathway Analysis</p>
        </header>

        <div class="pathway-diagram">
            <canvas id="pathway-canvas"></canvas>
        </div>

        <div class="controls-grid">
            <div class="control-card">
                <h3>Metabolic Pathways</h3>
                <select id="pathway-select" onchange="selectPathway(this.value)">
                    <option value="">Select pathway...</option>
                    <option value="glycolysis">Glycolysis</option>
                    <option value="tca">TCA Cycle (Krebs)</option>
                    <option value="oxphos">Oxidative Phosphorylation</option>
                    <option value="pentose">Pentose Phosphate Pathway</option>
                    <option value="fatty">Fatty Acid Oxidation</option>
                    <option value="amino">Amino Acid Metabolism</option>
                </select>
                <div class="metabolite-list" id="metabolite-list"></div>
            </div>

            <div class="control-card">
                <h3>Flux Controls</h3>
                <div class="slider-group">
                    <label>Oxygen Level: <span id="oxygen-val">100</span>%</label>
                    <input type="range" id="oxygen" min="0" max="100" value="100" 
                           oninput="updateOxygen(this.value)">
                </div>
                <div class="slider-group">
                    <label>Glucose Input: <span id="glucose-val">50</span> mM</label>
                    <input type="range" id="glucose" min="0" max="100" value="50" 
                           oninput="updateGlucose(this.value)">
                </div>
                <div class="slider-group">
                    <label>ATP Demand: <span id="atp-demand-val">50</span>%</label>
                    <input type="range" id="atp-demand" min="0" max="100" value="50" 
                           oninput="updateATPDemand(this.value)">
                </div>
                <button onclick="togglePathwayMode('aerobic')" id="btn-aerobic" class="active">Aerobic Mode</button>
                <button onclick="togglePathwayMode('anaerobic')" id="btn-anaerobic">Anaerobic Mode</button>
            </div>

            <div class="control-card">
                <h3>Production Metrics</h3>
                <div class="flux-stats">
                    <div class="stat-box">
                        <div class="stat-label">ATP Output</div>
                        <div class="stat-value" id="atp-output">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">NADH</div>
                        <div class="stat-value" id="nadh">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">CO₂</div>
                        <div class="stat-value" id="co2">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Efficiency</div>
                        <div class="stat-value" id="efficiency">0%</div>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button onclick="resetFlux()">Reset System</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let currentPathway = null;
        let oxygenLevel = 100;
        let glucoseInput = 50;
        let atpDemand = 50;
        let mode = 'aerobic';
        let animationFrame = 0;

        const pathwayData = {
            glycolysis: {
                name: "Glycolysis",
                metabolites: ["Glucose", "G6P", "F6P", "F1,6BP", "G3P", "1,3BPG", "3PG", "2PG", "PEP", "Pyruvate"],
                atpYield: 2,
                nadhYield: 2,
                color: "#44ff88"
            },
            tca: {
                name: "TCA Cycle",
                metabolites: ["Acetyl-CoA", "Citrate", "Isocitrate", "α-KG", "Succinyl-CoA", "Succinate", "Fumarate", "Malate", "Oxaloacetate"],
                atpYield: 2,
                nadhYield: 6,
                color: "#88ffaa"
            },
            oxphos: {
                name: "Oxidative Phosphorylation",
                metabolites: ["Complex I", "Complex II", "CoQ", "Complex III", "Cyt c", "Complex IV", "ATP Synthase"],
                atpYield: 28,
                nadhYield: 0,
                color: "#aaffcc"
            },
            pentose: {
                name: "Pentose Phosphate",
                metabolites: ["G6P", "6PG", "Ru5P", "R5P", "X5P", "S7P", "E4P", "F6P", "G3P"],
                atpYield: 0,
                nadhYield: 2,
                color: "#66ffaa"
            },
            fatty: {
                name: "Fatty Acid Oxidation",
                metabolites: ["Fatty Acyl-CoA", "Enoyl-CoA", "L-3-OH-acyl-CoA", "3-Ketoacyl-CoA", "Acetyl-CoA"],
                atpYield: 17,
                nadhYield: 7,
                color: "#99ff88"
            },
            amino: {
                name: "Amino Acid Metabolism",
                metabolites: ["Amino Acids", "α-Keto Acids", "Pyruvate", "Acetyl-CoA", "TCA Intermediates"],
                atpYield: 4,
                nadhYield: 3,
                color: "#77ffaa"
            }
        };

        function init() {
            canvas = document.getElementById('pathway-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = 400;
            
            window.addEventListener('resize', () => {
                canvas.width = canvas.offsetWidth;
                if (currentPathway) drawPathway();
            });
            
            animate();
        }

        function selectPathway(pathwayId) {
            if (!pathwayId) return;
            currentPathway = pathwayData[pathwayId];
            updateMetaboliteList();
            updateStats();
            drawPathway();
        }

        function drawPathway() {
            if (!currentPathway) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const metabolites = currentPathway.metabolites;
            const count = metabolites.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.35;

            // Draw connections
            ctx.strokeStyle = currentPathway.color + '40';
            ctx.lineWidth = 2;
            for (let i = 0; i < count; i++) {
                const angle1 = (i / count) * Math.PI * 2 - Math.PI / 2;
                const angle2 = ((i + 1) / count) * Math.PI * 2 - Math.PI / 2;
                
                const x1 = centerX + Math.cos(angle1) * radius;
                const y1 = centerY + Math.sin(angle1) * radius;
                const x2 = centerX + Math.cos(angle2) * radius;
                const y2 = centerY + Math.sin(angle2) * radius;
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                // Animated flow particles
                const flowProgress = (animationFrame % 60) / 60;
                const fx = x1 + (x2 - x1) * flowProgress;
                const fy = y1 + (y2 - y1) * flowProgress;
                
                ctx.fillStyle = currentPathway.color;
                ctx.beginPath();
                ctx.arc(fx, fy, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw metabolite nodes
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius;
                
                const pulse = Math.sin(animationFrame * 0.1 + i) * 5 + 25;
                
                ctx.fillStyle = currentPathway.color;
                ctx.beginPath();
                ctx.arc(x, y, pulse, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#0a2a0a';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(metabolites[i], x, y);
            }

            // Draw title
            ctx.fillStyle = currentPathway.color;
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(currentPathway.name, centerX, 30);
        }

        function animate() {
            requestAnimationFrame(animate);
            animationFrame++;
            if (currentPathway) {
                drawPathway();
            }
        }

        function updateMetaboliteList() {
            if (!currentPathway) return;
            
            const listEl = document.getElementById('metabolite-list');
            listEl.innerHTML = '';

            currentPathway.metabolites.forEach(metabolite => {
                const div = document.createElement('div');
                div.className = 'metabolite-item';
                div.innerHTML = `
                    <span class="metabolite-name">${metabolite}</span>
                    <span class="metabolite-level">${Math.floor(Math.random() * 50 + 50)}%</span>
                `;
                listEl.appendChild(div);
            });
        }

        function updateOxygen(value) {
            oxygenLevel = parseInt(value);
            document.getElementById('oxygen-val').textContent = value;
            updateStats();
        }

        function updateGlucose(value) {
            glucoseInput = parseInt(value);
            document.getElementById('glucose-val').textContent = value;
            updateStats();
        }

        function updateATPDemand(value) {
            atpDemand = parseInt(value);
            document.getElementById('atp-demand-val').textContent = value;
            updateStats();
        }

        function togglePathwayMode(newMode) {
            mode = newMode;
            document.getElementById('btn-aerobic').classList.remove('active');
            document.getElementById('btn-anaerobic').classList.remove('active');
            document.getElementById('btn-' + newMode).classList.add('active');
            updateStats();
        }

        function updateStats() {
            if (!currentPathway) return;

            const oxygenFactor = mode === 'aerobic' ? (oxygenLevel / 100) : 0.1;
            const glucoseFactor = (glucoseInput / 100);
            const demandFactor = (atpDemand / 100);

            const atpOutput = Math.round(currentPathway.atpYield * glucoseFactor * oxygenFactor * demandFactor * 10);
            const nadhOutput = Math.round(currentPathway.nadhYield * glucoseFactor * oxygenFactor);
            const co2Output = mode === 'aerobic' ? Math.round(glucoseFactor * oxygenFactor * 6) : 0;
            const efficiency = Math.round(oxygenFactor * glucoseFactor * 100);

            document.getElementById('atp-output').textContent = atpOutput;
            document.getElementById('nadh').textContent = nadhOutput;
            document.getElementById('co2').textContent = co2Output;
            document.getElementById('efficiency').textContent = efficiency + '%';
        }

        function resetFlux() {
            oxygenLevel = 100;
            glucoseInput = 50;
            atpDemand = 50;
            mode = 'aerobic';
            
            document.getElementById('oxygen').value = 100;
            document.getElementById('glucose').value = 50;
            document.getElementById('atp-demand').value = 50;
            
            updateOxygen(100);
            updateGlucose(50);
            updateATPDemand(50);
            togglePathwayMode('aerobic');
        }

        init();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchmove', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchend', function(e) {
              e.preventDefault();
              canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, {passive: false});
          });
        })();
        /* ===== END MOBILE TOUCH SUPPORT ===== */
    </script>
