<body>

    <div id="live-ticker"></div>
    <div class="container">
        <header>
            <h1>Epidemiological Transmission</h1>
            <p class="subtitle">SIR/SEIR Disease Spread Modeling & Outbreak Simulation</p>
        </header>

        <div class="main-grid">
            <div id="canvas-container">
                <canvas id="epi-canvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Model Type</h3>
                    <button onclick="setModel('SIR')" id="btn-sir" class="active">SIR Model</button>
                    <button onclick="setModel('SEIR')" id="btn-seir">SEIR Model</button>
                </div>

                <div class="control-section">
                    <h3>Disease Parameters</h3>
                    <div class="slider-group">
                        <label>Transmission Rate (β): <span id="beta-val">0.5</span></label>
                        <input type="range" id="beta" min="0.1" max="1.0" step="0.05" value="0.5" 
                               oninput="updateBeta(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Recovery Rate (γ): <span id="gamma-val">0.1</span></label>
                        <input type="range" id="gamma" min="0.05" max="0.5" step="0.05" value="0.1" 
                               oninput="updateGamma(this.value)">
                    </div>
                    <div class="slider-group" id="incubation-control" style="display:none;">
                        <label>Incubation Rate (σ): <span id="sigma-val">0.2</span></label>
                        <input type="range" id="sigma" min="0.1" max="0.5" step="0.05" value="0.2" 
                               oninput="updateSigma(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Initial Infected: <span id="init-inf-val">5</span></label>
                        <input type="range" id="init-inf" min="1" max="20" value="5" 
                               oninput="updateInitInf(this.value)">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Interventions</h3>
                    <div class="slider-group">
                        <label>Vaccination Rate: <span id="vacc-val">0</span>%</label>
                        <input type="range" id="vaccination" min="0" max="100" value="0" 
                               oninput="updateVaccination(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Social Distancing: <span id="dist-val">0</span>%</label>
                        <input type="range" id="distancing" min="0" max="100" value="0" 
                               oninput="updateDistancing(this.value)">
                    </div>
                </div>

                <div class="stats-panel">
                    <h3 style="color: #ff88aa; margin-bottom: 15px;">Population Status</h3>
                    <div class="stat-row">
                        <div class="stat-box">
                            <div class="stat-label">Susceptible</div>
                            <div class="stat-value susceptible" id="s-count">1000</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Infected</div>
                            <div class="stat-value infected" id="i-count">5</div>
                        </div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-box">
                            <div class="stat-label">Recovered</div>
                            <div class="stat-value recovered" id="r-count">0</div>
                        </div>
                        <div class="stat-box" id="exposed-box" style="display:none;">
                            <div class="stat-label">Exposed</div>
                            <div class="stat-value" style="color: #ffaa44;" id="e-count">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">R₀</div>
                            <div class="stat-value" id="r0">0</div>
                        </div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-box">
                            <div class="stat-label">Day</div>
                            <div class="stat-value" id="day">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Peak Day</div>
                            <div class="stat-value" id="peak-day">--</div>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <button onclick="toggleSimulation()">Play/Pause</button>
                    <button onclick="resetSimulation()">Reset</button>
                </div>
            </div>
        </div>

    <script>
        let canvas, ctx;
        let S = 995, I = 5, R = 0, E = 0;
        let beta = 0.5, gamma = 0.1, sigma = 0.2;
        let vaccination = 0, distancing = 0;
        let day = 0, isRunning = true, modelType = 'SIR';
        let history = { s: [], i: [], r: [], e: [] };
        const maxHistory = 200, N = 1000;
        let peakInfected = 0, peakDay = 0;

        function init() {
            canvas = document.getElementById('epi-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = 650;
            animate();
        }

        function setModel(type) {
            modelType = type;
            document.getElementById('btn-sir').classList.remove('active');
            document.getElementById('btn-seir').classList.remove('active');
            document.getElementById('btn-' + type.toLowerCase()).classList.add('active');
            document.getElementById('incubation-control').style.display = type === 'SEIR' ? 'block' : 'none';
            document.getElementById('exposed-box').style.display = type === 'SEIR' ? 'block' : 'none';
            resetSimulation();
        }

        function updateBeta(v) { beta = parseFloat(v); document.getElementById('beta-val').textContent = v; updateR0(); }
        function updateGamma(v) { gamma = parseFloat(v); document.getElementById('gamma-val').textContent = v; updateR0(); }
        function updateSigma(v) { sigma = parseFloat(v); document.getElementById('sigma-val').textContent = v; }
        function updateInitInf(v) { I = parseInt(v); S = N - I - R - E; document.getElementById('init-inf-val').textContent = v; }
        function updateVaccination(v) { vaccination = parseInt(v); document.getElementById('vacc-val').textContent = v; }
        function updateDistancing(v) { distancing = parseInt(v); document.getElementById('dist-val').textContent = v; }

        function updateR0() {
            const effectiveBeta = beta * (1 - distancing / 100);
            const r0 = (effectiveBeta / gamma).toFixed(2);
            document.getElementById('r0').textContent = r0;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isRunning && I > 0.5) {
                updateEpidemiology();
                draw();
            }
        }

        function updateEpidemiology() {
            const dt = 0.5;
            const effectiveBeta = beta * (1 - distancing / 100);
            const vaccRate = vaccination / 100;

            if (modelType === 'SIR') {
                const dS = -effectiveBeta * S * I / N - vaccRate * S * dt;
                const dI = (effectiveBeta * S * I / N - gamma * I) * dt;
                const dR = (gamma * I + vaccRate * S) * dt;

                S = Math.max(0, S + dS);
                I = Math.max(0, I + dI);
                R = Math.min(N, R + dR);
            } else {
                const dS = -effectiveBeta * S * I / N - vaccRate * S * dt;
                const dE = (effectiveBeta * S * I / N - sigma * E) * dt;
                const dI = (sigma * E - gamma * I) * dt;
                const dR = (gamma * I + vaccRate * S) * dt;

                S = Math.max(0, S + dS);
                E = Math.max(0, E + dE);
                I = Math.max(0, I + dI);
                R = Math.min(N, R + dR);
            }

            if (I > peakInfected) {
                peakInfected = I;
                peakDay = Math.round(day);
            }

            history.s.push(S); history.i.push(I); history.r.push(R); history.e.push(E);
            if (history.s.length > maxHistory) {
                history.s.shift(); history.i.shift(); history.r.shift(); history.e.shift();
            }

            day += dt;
            document.getElementById('s-count').textContent = Math.round(S);
            document.getElementById('i-count').textContent = Math.round(I);
            document.getElementById('r-count').textContent = Math.round(R);
            document.getElementById('e-count').textContent = Math.round(E);
            document.getElementById('day').textContent = Math.round(day);
            document.getElementById('peak-day').textContent = peakDay || '--';
            updateR0();
        }

        function draw() {
            ctx.fillStyle = '#2a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const graphHeight = 300;
            const graphY = 50;
            const scale = graphHeight / N;

            // Draw stacked area chart
            const w = canvas.width / maxHistory;
            for (let i = 0; i < history.s.length; i++) {
                const x = i * w;
                const sHeight = history.s[i] * scale;
                const iHeight = history.i[i] * scale;
                const rHeight = history.r[i] * scale;
                const eHeight = history.e[i] * scale;

                ctx.fillStyle = '#44ff88';
                ctx.fillRect(x, graphY + graphHeight - sHeight, w, sHeight);

                if (modelType === 'SEIR') {
                    ctx.fillStyle = '#ffaa44';
                    ctx.fillRect(x, graphY + graphHeight - sHeight - eHeight, w, eHeight);
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(x, graphY + graphHeight - sHeight - eHeight - iHeight, w, iHeight);
                } else {
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(x, graphY + graphHeight - sHeight - iHeight, w, iHeight);
                }

                ctx.fillStyle = '#4488ff';
                ctx.fillRect(x, graphY, w, rHeight);
            }

            // Draw legend
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#44ff88';
            ctx.fillText('Susceptible', 20, graphY + graphHeight + 40);
            ctx.fillStyle = '#ff4444';
            ctx.fillText('Infected', 150, graphY + graphHeight + 40);
            ctx.fillStyle = '#4488ff';
            ctx.fillText('Recovered', 270, graphY + graphHeight + 40);
            if (modelType === 'SEIR') {
                ctx.fillStyle = '#ffaa44';
                ctx.fillText('Exposed', 400, graphY + graphHeight + 40);
            }

            // Simulate population dots
            const dotRadius = 3;
            const gridSize = 40;
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const idx = i * gridSize + j;
                    const total = S + I + R + E;
                    const x = (i / gridSize) * canvas.width;
                    const y = graphY + graphHeight + 80 + (j / gridSize) * 250;

                    if (idx < S) {
                        ctx.fillStyle = '#44ff88';
                        ctx.beginPath();
                        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (idx < S + E) {
                        ctx.fillStyle = '#ffaa44';
                        ctx.beginPath();
                        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (idx < S + E + I) {
                        ctx.fillStyle = '#ff4444';
                        ctx.beginPath();
                        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (idx < N) {
                        ctx.fillStyle = '#4488ff';
                        ctx.beginPath();
                        ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function toggleSimulation() { isRunning = !isRunning; if (isRunning) animate(); }
        
        function resetSimulation() {
            S = 995; I = 5; R = 0; E = 0; day = 0;
            peakInfected = 0; peakDay = 0;
            history = { s: [], i: [], r: [], e: [] };
            document.getElementById('init-inf').value = 5;
            updateInitInf(5);
        }

        init();
        updateR0();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchmove', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchend', function(e) {
              e.preventDefault();
              canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, {passive: false});
          });
        })();
        /* ===== END MOBILE TOUCH SUPPORT ===== */
    </script>
