<body>
    <!-- NAV BAR -->
    <nav class="nav-bar" id="main-nav"></nav>
    <div id="live-ticker"></div>
    <div class="container">
        <header>
            <h1>Neural Plasticity</h1>
            <p class="subtitle">Hebbian Learning & Synaptic Plasticity Modeling</p>
        </header>

        <div class="main-grid">
            <div id="canvas-container">
                <canvas id="neural-canvas"></canvas>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Plasticity Types</h3>
                    <button onclick="setPlasticity('hebbian')" id="btn-hebbian" class="active">Hebbian Learning</button>
                    <button onclick="setPlasticity('stdp')" id="btn-stdp">STDP</button>
                    <button onclick="setPlasticity('ltp')" id="btn-ltp">LTP (Potentiation)</button>
                    <button onclick="setPlasticity('ltd')" id="btn-ltd">LTD (Depression)</button>
                </div>

                <div class="control-section">
                    <h3>Stimulation Parameters</h3>
                    <div class="slider-group">
                        <label>Stimulus Frequency: <span id="freq-val">10</span> Hz</label>
                        <input type="range" id="frequency" min="1" max="100" value="10" 
                               oninput="updateFrequency(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Stimulus Intensity: <span id="intensity-val">50</span>%</label>
                        <input type="range" id="intensity" min="0" max="100" value="50" 
                               oninput="updateIntensity(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Learning Rate: <span id="learning-val">0.1</span></label>
                        <input type="range" id="learning" min="0.01" max="0.5" step="0.01" value="0.1" 
                               oninput="updateLearning(this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Decay Rate: <span id="decay-val">0.01</span></label>
                        <input type="range" id="decay" min="0.001" max="0.1" step="0.001" value="0.01" 
                               oninput="updateDecay(this.value)">
                    </div>
                </div>

                <div class="control-section">
                    <h3>Training Patterns</h3>
                    <button onclick="trainPattern('sequence')">Sequential Pattern</button>
                    <button onclick="trainPattern('random')">Random Stimulation</button>
                    <button onclick="trainPattern('paired')">Paired Association</button>
                    <button onclick="clearWeights()">Clear Weights</button>
                </div>

                <div class="stats-panel">
                    <h3 style="color: #88aaff; margin-bottom: 15px;">Network Statistics</h3>
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-label">Avg Strength</div>
                            <div class="stat-value" id="avg-strength">0.5</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Active Synapses</div>
                            <div class="stat-value" id="active-syn">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Total Spikes</div>
                            <div class="stat-value" id="total-spikes">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Learning</div>
                            <div class="stat-value" id="learning-state">Inactive</div>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <button onclick="toggleSimulation()">Play/Pause</button>
                    <button onclick="resetNetwork()">Reset Network</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let canvas, ctx;
        let neurons = [];
        let synapses = [];
        let frequency = 10, intensity = 50, learningRate = 0.1, decayRate = 0.01;
        let plasticityType = 'hebbian';
        let isRunning = true, time = 0, totalSpikes = 0;
        const neuronCount = 30;

        function init() {
            canvas = document.getElementById('neural-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = 700;
            createNetwork();
            animate();
        }

        function createNetwork() {
            neurons = [];
            synapses = [];
            const radius = 250;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < neuronCount; i++) {
                const angle = (i / neuronCount) * Math.PI * 2;
                neurons.push({
                    x: centerX + Math.cos(angle) * radius,
                    y: centerY + Math.sin(angle) * radius,
                    activity: 0,
                    lastSpike: 0
                });
            }

            for (let i = 0; i < neuronCount; i++) {
                for (let j = 0; j < neuronCount; j++) {
                    if (i !== j && Math.random() < 0.15) {
                        synapses.push({
                            from: i,
                            to: j,
                            weight: 0.5,
                            lastUpdate: 0
                        });
                    }
                }
            }
        }

        function setPlasticity(type) {
            plasticityType = type;
            ['hebbian', 'stdp', 'ltp', 'ltd'].forEach(t => {
                document.getElementById('btn-' + t).classList.remove('active');
            });
            document.getElementById('btn-' + type).classList.add('active');
        }

        function updateFrequency(v) { frequency = parseInt(v); document.getElementById('freq-val').textContent = v; }
        function updateIntensity(v) { intensity = parseInt(v); document.getElementById('intensity-val').textContent = v; }
        function updateLearning(v) { learningRate = parseFloat(v); document.getElementById('learning-val').textContent = v; }
        function updateDecay(v) { decayRate = parseFloat(v); document.getElementById('decay-val').textContent = v; }

        function animate() {
            if (!isRunning) return;
            requestAnimationFrame(animate);
            
            time += 0.016;
            updateNeurons();
            draw();
        }

        function updateNeurons() {
            // Random spontaneous activity based on frequency
            neurons.forEach((n, i) => {
                if (Math.random() < (frequency / 1000) * (intensity / 100)) {
                    n.activity = 1;
                    n.lastSpike = time;
                    totalSpikes++;
                } else {
                    n.activity *= 0.95;
                }
            });

            // Update synaptic weights based on plasticity type
            synapses.forEach(syn => {
                const preNeuron = neurons[syn.from];
                const postNeuron = neurons[syn.to];

                if (plasticityType === 'hebbian') {
                    if (preNeuron.activity > 0.5 && postNeuron.activity > 0.5) {
                        syn.weight = Math.min(1, syn.weight + learningRate * 0.01);
                    }
                } else if (plasticityType === 'stdp') {
                    const timeDiff = postNeuron.lastSpike - preNeuron.lastSpike;
                    if (Math.abs(timeDiff) < 0.1) {
                        if (timeDiff > 0) syn.weight = Math.min(1, syn.weight + learningRate * 0.01);
                        else syn.weight = Math.max(0, syn.weight - learningRate * 0.005);
                    }
                } else if (plasticityType === 'ltp') {
                    if (preNeuron.activity > 0.5) {
                        syn.weight = Math.min(1, syn.weight + learningRate * 0.02);
                    }
                } else if (plasticityType === 'ltd') {
                    if (preNeuron.activity > 0.5) {
                        syn.weight = Math.max(0, syn.weight - learningRate * 0.01);
                    }
                }

                syn.weight = Math.max(0, syn.weight - decayRate * 0.001);

                if (preNeuron.activity > 0.5 && syn.weight > 0.3) {
                    postNeuron.activity = Math.min(1, postNeuron.activity + syn.weight * 0.1);
                }
            });

            updateStats();
        }

        function draw() {
            ctx.fillStyle = '#0a1a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw synapses
            synapses.forEach(syn => {
                const from = neurons[syn.from];
                const to = neurons[syn.to];
                
                ctx.strokeStyle = `rgba(68, 136, 255, ${syn.weight * 0.6})`;
                ctx.lineWidth = syn.weight * 3;
                ctx.beginPath();
                ctx.moveTo(from.x, from.y);
                ctx.lineTo(to.x, to.y);
                ctx.stroke();
            });

            // Draw neurons
            neurons.forEach((n, i) => {
                const size = 10 + n.activity * 15;
                const brightness = Math.floor(136 + n.activity * 119);
                
                ctx.fillStyle = `rgb(${brightness}, ${brightness + 50}, 255)`;
                ctx.beginPath();
                ctx.arc(n.x, n.y, size, 0, Math.PI * 2);
                ctx.fill();

                if (n.activity > 0.7) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });
        }

        function updateStats() {
            const avgWeight = synapses.reduce((sum, s) => sum + s.weight, 0) / synapses.length;
            const activeSynapses = synapses.filter(s => s.weight > 0.5).length;
            
            document.getElementById('avg-strength').textContent = avgWeight.toFixed(2);
            document.getElementById('active-syn').textContent = activeSynapses;
            document.getElementById('total-spikes').textContent = totalSpikes;
            document.getElementById('learning-state').textContent = 
                avgWeight > 0.6 ? 'Active' : avgWeight > 0.4 ? 'Moderate' : 'Low';
        }

        function trainPattern(type) {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    if (type === 'sequence') {
                        neurons[i % neuronCount].activity = 1;
                        neurons[i % neuronCount].lastSpike = time;
                    } else if (type === 'random') {
                        neurons[Math.floor(Math.random() * neuronCount)].activity = 1;
                    } else if (type === 'paired') {
                        neurons[i % 10].activity = 1;
                        neurons[10 + (i % 10)].activity = 1;
                    }
                }, i * 50);
            }
        }

        function clearWeights() {
            synapses.forEach(s => s.weight = 0.3);
        }

        function toggleSimulation() {
            isRunning = !isRunning;
            if (isRunning) animate();
        }

        function resetNetwork() {
            createNetwork();
            time = 0;
            totalSpikes = 0;
        }

        init();

        /* ===== MOBILE TOUCH SUPPORT ===== */
        (function() {
          if (!/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;

          document.querySelectorAll('canvas').forEach(function(canvas) {
            canvas.addEventListener('touchstart', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousedown', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchmove', function(e) {
              e.preventDefault();
              var touch = e.touches[0];
              canvas.dispatchEvent(new MouseEvent('mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY,
                bubbles: true
              }));
            }, {passive: false});

            canvas.addEventListener('touchend', function(e) {
              e.preventDefault();
              canvas.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            }, {passive: false});
          });
        })();
        /* ===== END MOBILE TOUCH SUPPORT ===== */
    </script>
