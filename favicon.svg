<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Rich Blue gradient - Sapphire -->
    <linearGradient id="dnaGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3377ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055ff;stop-opacity:1" />
    </linearGradient>
    <!-- Deep Blue gradient - Royal -->
    <linearGradient id="dnaGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0033cc;stop-opacity:1" />
    </linearGradient>
    <!-- 24K Gold accent gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:1" />
    </linearGradient>
    <!-- Microfluidic channel gradient -->
    <linearGradient id="channelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0055ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#0055ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055ff;stop-opacity:0" />
    </linearGradient>
    <!-- Glow filter - Rich blue -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Chip border glow -->
    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background - Deep Space Navy -->
  <rect width="512" height="512" fill="#000510"/>

  <!-- Outer chip frame with glow -->
  <rect x="40" y="40" width="432" height="432" rx="40" ry="40"
        fill="none" stroke="url(#dnaGradient1)" stroke-width="3"
        filter="url(#chipGlow)" opacity="0.6"/>

  <!-- Inner chip area -->
  <rect x="60" y="60" width="392" height="392" rx="30" ry="30"
        fill="rgba(0, 8, 32, 0.5)" stroke="rgba(0, 85, 255, 0.3)" stroke-width="1"/>

  <!-- Microfluidic channels - horizontal -->
  <path d="M80 180 Q 160 180 200 220 T 320 220 T 432 180"
        fill="none" stroke="rgba(0, 85, 255, 0.4)" stroke-width="6" stroke-linecap="round"/>
  <path d="M80 332 Q 160 332 200 292 T 320 292 T 432 332"
        fill="none" stroke="rgba(0, 68, 221, 0.4)" stroke-width="6" stroke-linecap="round"/>

  <!-- DNA Helix - Left strand (Rich Blue) -->
  <path d="M160 100
           Q 200 130 180 160
           Q 160 190 200 220
           Q 240 250 200 280
           Q 160 310 200 340
           Q 240 370 200 400
           Q 180 420 160 412"
        fill="none" stroke="url(#dnaGradient1)" stroke-width="12"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- DNA Helix - Right strand (Deep Blue) -->
  <path d="M352 100
           Q 312 130 332 160
           Q 352 190 312 220
           Q 272 250 312 280
           Q 352 310 312 340
           Q 272 370 312 400
           Q 332 420 352 412"
        fill="none" stroke="url(#dnaGradient2)" stroke-width="12"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Base pairs connecting the strands (24K gold bonds) -->
  <line x1="180" y1="160" x2="332" y2="160" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <line x1="200" y1="220" x2="312" y2="220" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <line x1="200" y1="280" x2="312" y2="280" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <line x1="200" y1="340" x2="312" y2="340" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>
  <line x1="200" y1="400" x2="312" y2="400" stroke="url(#goldGradient)" stroke-width="4" stroke-dasharray="8 4" opacity="0.8"/>

  <!-- Nucleotide dots on strands - Rich Blue -->
  <circle cx="180" cy="160" r="10" fill="#0055ff" filter="url(#glow)"/>
  <circle cx="200" cy="220" r="10" fill="#0066ff" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="10" fill="#0055ff" filter="url(#glow)"/>
  <circle cx="200" cy="340" r="10" fill="#0066ff" filter="url(#glow)"/>
  <circle cx="200" cy="400" r="10" fill="#0055ff" filter="url(#glow)"/>

  <!-- Nucleotide dots - Deep Blue -->
  <circle cx="332" cy="160" r="10" fill="#0044dd" filter="url(#glow)"/>
  <circle cx="312" cy="220" r="10" fill="#0033cc" filter="url(#glow)"/>
  <circle cx="312" cy="280" r="10" fill="#0044dd" filter="url(#glow)"/>
  <circle cx="312" cy="340" r="10" fill="#0033cc" filter="url(#glow)"/>
  <circle cx="312" cy="400" r="10" fill="#0044dd" filter="url(#glow)"/>

  <!-- Microfluidic wells/chambers at corners - Rich Blue -->
  <circle cx="100" cy="100" r="20" fill="rgba(0, 85, 255, 0.3)" stroke="#0055ff" stroke-width="2"/>
  <circle cx="412" cy="100" r="20" fill="rgba(0, 85, 255, 0.3)" stroke="#0066ff" stroke-width="2"/>
  <circle cx="100" cy="412" r="20" fill="rgba(0, 68, 221, 0.3)" stroke="#0044dd" stroke-width="2"/>
  <circle cx="412" cy="412" r="20" fill="rgba(0, 68, 221, 0.3)" stroke="#0033cc" stroke-width="2"/>

  <!-- Connection ports (microfluidic inlets/outlets) - 24K Gold -->
  <rect x="240" y="45" width="32" height="20" rx="4" fill="#ffaa00" opacity="0.8"/>
  <rect x="240" y="447" width="32" height="20" rx="4" fill="#ffcc00" opacity="0.8"/>
  <rect x="45" y="240" width="20" height="32" rx="4" fill="#ffaa00" opacity="0.8"/>
  <rect x="447" y="240" width="20" height="32" rx="4" fill="#ffcc00" opacity="0.8"/>

  <!-- Center PA monogram hint - 24K Gold -->
  <text x="256" y="268" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="url(#goldGradient)" text-anchor="middle" opacity="0.15">PA</text>
</svg>
